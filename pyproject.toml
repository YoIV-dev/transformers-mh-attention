[project]
name = "transformers-mh-attention"
version = "0.1.0"
description = "Refactored Multi-Head Attention and Transformer implementation based on UvA-DL Tutorial 6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26,<3.0",
    "pytorch-lightning>=2.2,<2.6",
    "seaborn>=0.13",
    "torch>=2.2,<2.8",
    "torchvision>=0.17",
    "tqdm>=4.66",
]

[project.scripts]
transformers-mh-attention = "transformers_mh_attention.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformers_mh_attention"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["transformers_mh_attention"]
